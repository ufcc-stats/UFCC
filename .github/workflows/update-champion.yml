name: Update champion

on:
  schedule:
    # Cada hora. A */5 esto se comía la cuota de Actions: se factura por job
    # redondeando al minuto, así que da igual que el script salga en 3 segundos.
    # El campeón solo cambia cuando juega el campeón, así que con cadencia horaria
    # el relevo se refleja con menos de una hora de retraso.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar update aunque no toque (1=sí)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: update-champion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run API update
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          FORCE_UPDATE: ${{ github.event.inputs.force || '0' }}
        run: python update_from_api.py

      - name: Re-export web data
        run: python export_web.py

      - name: Commit + push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name  "github-actions[bot]"
            git add -A
            git commit -m "chore: daily champion update from api-football"
            # La Action de nations tambien empuja a main; rebase para evitar
            # rechazos por solape de pushes.
            git pull --rebase origin main
            git push
          else
            echo "No changes."
          fi
